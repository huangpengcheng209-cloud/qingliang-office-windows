name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check source and patch hashes
        run: python tools/verify_sources.py
      - name: Check dependency source and patch lock
        run: python tools/build_dependencies.py verify
      - name: Check pinned kernel inputs and separate fixes
        run: python tools/build_kernel.py verify
      - name: Check x2t prerequisite inputs and separate fixes
        run: python tools/build_x2t_dependencies.py verify
      - name: Check network and crypto source inputs
        run: python tools/build_transport.py verify
      - name: Check font archives, adaptation and generated project inputs
        run: python tools/build_fonts.py verify
      - name: Check HEIF codec archives and separate patches
        run: python tools/build_heif.py verify
      - name: Check complete graphics inputs and separate rendering fixes
        run: python tools/build_graphics.py verify
      - name: Check VBA and text format inputs and parser fixes
        run: python tools/build_formats.py verify
      - name: Check DOCX conversion and HTML support inputs
        run: python tools/build_docx.py verify
      - name: Check complete converter, V8, SDKJS and separate fixes
        run: python tools/build_converter.py verify
      - name: Check desktop Hunspell source and adaptations
        run: python tools/build_desktop.py verify
      - name: Test preservation and tamper detection
        env:
          QINGLIANG_TEST_TEMP: ${{ runner.temp }}/qingliang-tests
        run: python -m unittest discover -s tests -v
      - name: Verify patches against pinned public upstream files
        run: python tools/verify_patches.py --cache "${{ runner.temp }}/qingliang-selected-bases"

  native-save:
    name: Windows native save component
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile published save component and run real file tests
        run: python tools/build_windows.py save-transaction --work-dir "${{ runner.temp }}/qingliang-native-build"

  desktop-spelling:
    name: Windows desktop spelling dependency
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build fixed Hunspell and test real dictionary operations
        run: python tools/build_desktop.py build --work-dir "${{ runner.temp }}/qingliang-desktop-build"
      - name: Preserve desktop component evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-spelling-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/qingliang-desktop-build/desktop-*.json
            ${{ runner.temp }}/qingliang-desktop-build/desktop-*.log
            ${{ runner.temp }}/qingliang-desktop-build/desktop-imports.txt

  unicode-dependencies:
    name: Windows dependencies, formats and complete x2t converter
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare pinned Boost and ICU, compile ICU and UnicodeConverter, run native tests
        run: python tools/build_dependencies.py build --work-dir "${{ runner.temp }}/qingliang-dependency-build"
      - name: Compile the pinned kernel with new dependencies and run linked file, ZIP and XML tests
        run: python tools/build_kernel.py build --work-dir "${{ runner.temp }}/qingliang-dependency-build"
      - name: Build Boost Regex, DateTime and CompoundFileLib, test Windows OLE interoperability
        run: python tools/build_x2t_dependencies.py build --work-dir "${{ runner.temp }}/qingliang-dependency-build"
      - name: Build kernel network and CryptoPPLib, test loopback HTTP and Windows CNG interoperability
        run: python tools/build_transport.py build --work-dir "${{ runner.temp }}/qingliang-dependency-build"
      - name: Build FreeType, Brotli and patched HarfBuzz, compare pinned upstream shaping goldens
        run: python tools/build_fonts.py build --work-dir "${{ runner.temp }}/qingliang-dependency-build"
      - name: Build x265, libde265 and libheif, test real HEIC pixels and metadata
        run: python tools/build_heif.py build --work-dir "${{ runner.temp }}/qingliang-dependency-build"
      - name: Build all graphics units, audit compiler inputs and run native rendering tests
        run: python tools/build_graphics.py build --work-dir "${{ runner.temp }}/qingliang-dependency-build"
      - name: Build VBA and text format archives, run isolated parser and text IO tests
        run: python tools/build_formats.py build --work-dir "${{ runner.temp }}/qingliang-dependency-build"
      - name: Build DOCX and shared format dependencies, test actual TXT and DOCX files
        run: python tools/build_docx.py build --work-dir "${{ runner.temp }}/qingliang-dependency-build"
      - name: Prepare independent Office and PDF readers
        shell: pwsh
        run: |
          $validation = Join-Path '${{ runner.temp }}' 'qingliang-validation'
          python -m venv $validation
          & (Join-Path $validation 'Scripts/python.exe') -m pip install --disable-pip-version-check -r tests/converter-requirements.txt
      - name: Build complete converter with source-built V8 and SDK scripts, test Office and PDF files
        shell: pwsh
        run: |
          $validation = Join-Path '${{ runner.temp }}' 'qingliang-validation/Scripts/python.exe'
          $java21 = Join-Path $env:JAVA_HOME_21_X64 'bin/java.exe'
          python tools/build_converter.py build --work-dir '${{ runner.temp }}/qingliang-dependency-build' --test-python $validation --java $java21
      - name: Print converter results
        if: always()
        shell: pwsh
        run: |
          $build = Join-Path '${{ runner.temp }}' 'qingliang-dependency-build'
          Get-ChildItem -LiteralPath $build -Filter '*test-result.json' | ForEach-Object { Write-Output $_.Name; Get-Content -LiteralPath $_.FullName }
          $cases = Join-Path $build 'converter-native-cases.json'
          if (Test-Path -LiteralPath $cases) { Get-Content -LiteralPath $cases }
      - name: Preserve converter evidence and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: converter-evidence
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/qingliang-dependency-build/converter-*.json
            ${{ runner.temp }}/qingliang-dependency-build/converter-*.log
            ${{ runner.temp }}/qingliang-dependency-build/converter-fixtures/*.png
